name: Data Entry pricing scope regression
on:
  pull_request:
    paths:
      - 'src/config/pricing.ts'
      - 'src/features/pricing/PricingSetup.tsx'
      - 'tests/pricing-scope.test.mjs'
      - '.github/workflows/pricing-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pricing-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/pricing-scope.test.mjs
